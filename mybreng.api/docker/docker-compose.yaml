services:
  db:
    image: mysql

    restart: always
    ports:
    - 3306:3306
    volumes:
    - ./certs:/etc/mysql/certs
    - ../sql:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mybreng
      MYSQL_USER: mybreng
      MYSQL_PASSWORD: Ui23N(ZzH}Ej(U
    command:
    - --ssl-ca=/etc/mysql/certs/ca.cert.pem
    - --ssl-cert=/etc/mysql/certs/mybreng-mysql.cert.pem
    - --ssl-key=/etc/mysql/certs/mybreng-mysql.key.pem

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
    - 8298:80
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
      MEMORY_LIMIT: 256M
    depends_on:
    - db
